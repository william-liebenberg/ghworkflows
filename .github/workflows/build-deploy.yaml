name: Deployment Workflow

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  checks: write

env:
  ARTIFACT_NAME: "my-webapi-artifact"
  SOLUTION_NAME: "MyWebApi"
  SOLUTION_PATH: "src/MyWebApi/MyWebApi.sln"

jobs:
  initialize_vars:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ env.ARTIFACT_NAME }}
      solution_name: ${{ env.SOLUTION_NAME }}
      solution_path: ${{ env.SOLUTION_PATH }}
    steps:
      - name: Initialise Variables
        run: echo "Initialising environment variables"

  build-and-test:
    name: Build, Test & Publish
    needs: initialize_vars
    uses: ./.github/workflows/template-build-test-publish.yaml
    with:
      artifact_name: ${{ needs.initialize_vars.outputs.artifact_name }}
      solution_name: ${{ needs.initialize_vars.outputs.solution_name }}
      solution_path: ${{ needs.initialize_vars.outputs.solution_path }}
